<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
  (function () {
    try {
      var theme = localStorage.getItem('theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch (err) { /* private mode etc — falls back to the default dark theme */ }
  })();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Login — Amit Sharma</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

<div class="login-shell">
  <a href="../index.html" class="login-back-link">&#8592; Back to site</a>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle light and dark theme">
    <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.3"/><path d="M12 2.5v2.6M12 18.9v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M2.5 12h2.6M18.9 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9"/></svg>
    <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M20 14.3A8.4 8.4 0 1 1 9.7 4a7 7 0 0 0 10.3 10.3Z"/></svg>
  </button>
  <div class="login-card">
    <span class="brand">Amit Sharma</span>
    <span class="sub">Owner Dashboard</span>

    <p class="login-error" id="loginError"></p>
    <p class="login-error" id="setupNotice" style="border-color:var(--brass);color:var(--espresso-text);background:rgba(176,141,87,0.12);"></p>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="loginSubmit">Log In</button>
    </form>
  </div>
</div>

<script>
(function () {
  const themeToggle = document.getElementById('themeToggle');
  themeToggle.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem('theme', next); } catch (err) { /* private mode etc — non-fatal */ }
  });

  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('loginError');
  const setupNotice = document.getElementById('setupNotice');
  const submitBtn = document.getElementById('loginSubmit');

  // Already logged in? Skip straight to the dashboard.
  fetch('/api/auth/me', { credentials: 'include' })
    .then((r) => { if (r.ok) window.location.href = 'dashboard.html'; })
    .catch(() => {});

  // No owner account created yet? Say so plainly instead of a confusing
  // "invalid email or password" on the very first attempt.
  fetch('/api/auth/setup-status')
    .then((r) => r.json())
    .then((data) => {
      if (!data.hasOwner) {
        setupNotice.textContent = 'No owner account exists yet. On the server, run: npm run seed — it prints a login email and password to the terminal.';
        setupNotice.classList.add('is-visible');
        submitBtn.disabled = true;
      }
    })
    .catch(() => {});

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('is-visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Logging in…';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        throw new Error(data.error || 'Login failed.');
      }
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorEl.textContent = err.message;
      errorEl.classList.add('is-visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Log In';
    }
  });
})();
</script>
</body>
</html>
